    formato: csv
    separador: ";"
    encoding: latin-1
    colunas:
      - codigo
      - descricao
    arquivos:
      - caminho: dados_externos/receita/2026-10
        padrao: municipios.csv
  naturezas:
    origem: pasta
    formato: csv
    separador: ";"
    encoding: latin-1
    colunas:
      - codigo
      - descricao
    arquivos:
      - caminho: dados_externos/receita/2026-10
        padrao: naturezas.csv
  paises:
    origem: pasta
    formato: csv
    separador: ";"
    encoding: latin-1
    colunas:
      - codigo
      - descricao
    arquivos:
      - caminho: dados_externos/receita/2026-10
        padrao: paises.csv
