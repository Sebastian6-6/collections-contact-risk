        - {documento: "01567032893", nome: "Ana", cnpj_empregador_raw: null, atributos_extra_estado_civil: "solteiro", atributos_extra_qtd_dependentes: 0, atributos_extra_score_externo: 625, atributos_extra_escolaridade: null, atributos_extra_possui_imovel: true, atributos_extra_fonte_score: "bureauX", endereco: "TRAVESSA Paulista, 764", logradouro: "TRAVESSA Paulista", numero: "764", endereco_json_complemento: null, bairro: null, cidade: "Rio", uf: "RJ", cep: "20638395", dt_ref: "2026-06-15", data_entrega: "2026-08-31", _linha: 2}
