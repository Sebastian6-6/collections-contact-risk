version: 2

unit_tests:
  - name: silver_gama_padronizacao_atributos_e_tres_formatos_de_endereco
    description: >
      O documento perde a máscara e recupera o zero perdido; os atributos extras viram colunas
      (chave ausente ou vazia dá `NULL`, o 0 fica 0); o endereço dos três formatos sai nas mesmas
      colunas e, nos de texto, só é separado quando casa com o padrão estrito; a data de entrega
      sai do nome do arquivo e, no histórico, da variável do projeto. A linha sem documento tem
      o teste `silver_gama_documento_vazio_ou_zerado_vira_nulo`.
    model: silver_gama_devedores_padronizados
    given:
      - input: source('bronze_gama', 'devedores')
        rows:
          - {documento: "015.670.328-93", nome: " Ana ", data_nascimento: "24/07/2002", cnpj_empregador_raw: "", dt_ref: "15/06/2026", contatos: '[{"tipo": "celular", "valor": "(21) 94780-1773"}]', endereco_json: '{"rua": "TRAVESSA Paulista, 764", "municipio": "Rio", "estado": " rj ", "cep": "20638395"}', atributos_extra: '{"estado_civil": "solteiro", "qtd_dependentes": 0, "score_externo": 625, "possui_imovel": true, "fonte_score": "bureauX"}', _arquivo: "contact_data/provedor_gama.csv", _linha: 2, _hash_arquivo: "h1", _motivo_ilegivel: null}
