version: 2

models:
  - name: silver_gama_devedores_padronizados
    description: >
      Etapa efêmera (não vira tabela) da silver do gama. Uma linha por linha lida da bronze que
      tem documento, com toda a padronização já aplicada e sem deduplicar. Alimenta `devedores`
      (versão mais recente) e `devedores_contatos` (todas as versões, abrindo a lista de
      contatos), para os dois padronizarem do mesmo jeito.
    config:
      materialized: ephemeral

  - name: silver_gama_devedores
    description: >
      Devedores do provedor gama, uma linha por documento normalizado. Vale a versão mais recente
      do documento: maior `dt_ref` (a data de atualização da fonte), depois maior data de entrega,
      depois maior arquivo (nome) e maior linha. Fora ficam, e continuam na bronze, a linha ilegível, o cabeçalho
      repetido dentro do histórico e o documento vazio ou só com zeros, que não identifica ninguém (S9);
      os contatos das linhas de documento vazio estão em `devedores_contatos` com `documento` NULL. O endereço vem em três formatos
      (colunas separadas, `rua` e `endereco`) e sai nas mesmas colunas; nos dois formatos de texto
      as partes só são separadas quando o texto casa inteiro com o padrão estrito, e o texto
      original fica em `endereco` (S7). Os `atributos_extra` viram colunas (S8). Nenhuma coluna
      recebe marcação interpretativa: datas sentinela e valores zero passam como vieram.

      Medição de `dt_ref` como data de atualização (2026-11-09, sobre as 19.505 linhas lidas):
      19.504 viram data (a restante é o cabeçalho repetido, que não tem data); nenhuma é posterior
      à data de entrega do arquivo. Nas entregas diárias (9.505 linhas), 8.791 trazem exatamente a
      data de entrega e 714 trazem 1 a 3 dias antes (mediana 0). No histórico a data vai de
      2025-01-27 a 2026-08, e 372 linhas trazem 2025-09-01, data que não aparece em nenhuma entrega
      diária. Com 5.391 documentos em mais de uma linha, ordenar por `dt_ref` escolhe outra linha
      que não a mais recente por entrega em 59 dos 11.436 documentos; tratar 2025-09-01 como
      ausente mudaria a escolha em 5 (consulta `analyses/medicao_ordenacao_devedores_gama.sql`;
      os 87 e 35 anteriores não se reproduzem). A regra da sentinela continua pendente de
      decisão do autor. Hoje `dt_ref` ordena porque nunca vem do futuro e acompanha
      a entrega nas diárias, e 2025-09-01 fica como veio (S8); quem trata essa data é a decisão
      pendente. A suposição de que `dt_ref` é a data de atualização do registro está
      no contrato do provedor.
    columns:
      - name: documento
        description: >-
          CPF só com dígitos, com os zeros à esquerda repostos até 11 posições. Chave da tabela.
        data_tests:
          - unique
          - not_null
      - name: nome
        description: "Nome do devedor, sem espaços nas pontas; `NULL` quando vazio."
      - name: data_nascimento
        description: "Data de nascimento, lida de `dd/mm/aaaa`. A data sentinela, se houver, fica como veio."
      - name: cnpj_empregador_raw
        description: >-
          CNPJ do empregador (campo `cnpj_empregador_raw` da origem) em maiúsculas e sem máscara, com zeros à esquerda repostos até 14
          posições. `NULL` quando o provedor não informou.
      - name: estado_civil
        description: "Estado civil de `atributos_extra`; `NULL` quando a chave não veio."
      - name: qtd_dependentes
        description: "Quantidade de dependentes de `atributos_extra`; `NULL` quando a chave não veio, e o 0 informado fica 0."
      - name: score_externo
        description: "Score de um birô externo, de `atributos_extra`; `NULL` quando a chave não veio."
      - name: escolaridade
        description: "Escolaridade de `atributos_extra`; `NULL` quando a chave não veio."
      - name: possui_imovel
        description: "Se o devedor possui imóvel, de `atributos_extra`; `NULL` quando a chave não veio."
      - name: fonte_score
        description: "Birô de onde vem o `score_externo`, de `atributos_extra`; `NULL` quando a chave não veio."
      - name: endereco
        description: >-
          Texto do endereço como veio, nos formatos `rua` ("logradouro, numero") e `endereco`
          ("logradouro, numero - bairro"). `NULL` quando o endereço veio em colunas separadas.
      - name: logradouro
        description: >-
          Logradouro: da coluna da origem ou, nos formatos de texto, do texto que casa com o
          padrão estrito; `NULL` quando não casa.
      - name: numero
        description: "Número do endereço (pode ser `S/N`), com a mesma regra do logradouro."
      - name: complemento
        description: "Complemento; só existe no formato de colunas separadas, e `NULL` quando não há."
      - name: bairro
        description: >-
          Bairro: da coluna da origem ou, no formato `endereco`, do texto que casa com o padrão
          estrito; `NULL` no formato `rua`, que não traz bairro.
      - name: cidade
        description: "Cidade, de `cidade` ou `municipio` conforme o formato do endereço."
      - name: uf
        description: >-
          Sigla da UF, de `uf` ou `estado` conforme o formato do endereço, em maiúsculas e sem
          espaços nas pontas. Valor fora das 27 UFs vira `NULL`; `NULL` também quando vazio.
        data_tests:
          - accepted_values:
              arguments:
                values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      - name: cep
        description: "CEP só com dígitos, com o zero à esquerda reposto até 8 posições (o provedor manda número em alguns formatos)."
      - name: dt_ref
        description: "Data de referência do registro informada pelo provedor, com o nome do campo da origem, usada para escolher a versão."
      - name: data_entrega
        description: >-
          Data da entrega do arquivo de onde veio a versão: a data escrita no nome do arquivo ou,
          só no arquivo histórico configurado, a variável `data_carga_historica` (2026-08-31, enunciado p. 1). `NULL` em entrega diária sem data válida no nome, o que reprova o teste `entrega_diaria_sem_data_valida`.
      - name: _arquivo
        description: "{{ doc('bronze_arquivo') }}"
        data_tests:
          - not_null
      - name: _linha
        description: "{{ doc('bronze_linha') }}"
        data_tests:
          - not_null
      - name: _hash_arquivo
        description: "{{ doc('bronze_hash_arquivo') }}"
        data_tests:
          - not_null

  - name: silver_gama_devedores_contatos
    description: >
      Histórico de contatos do provedor gama, uma linha por (documento, tipo_contato,
      contato normalizado), aberto da lista `contatos`. Considera todas as linhas da bronze com documento,
      não só a versão atual do devedor: um telefone ou e-mail que saiu da versão mais recente
      continua registrado, com a última data de entrega em que apareceu. A linha com a lista
      truncada não tem contato legível e fica sem contatos aqui, embora o devedor entre em
      `devedores`.
    data_tests:
      - combinacao_unica:
          arguments:
            colunas: [documento, tipo_contato, contato]
    columns:
      - name: documento
        description: >-
          Documento do devedor, como em `silver_gama.devedores`. `NULL` nos contatos de linhas de
          documento vazio ou zerado, que não são devedor: nesse caso o par (`tipo_contato`,
          `contato`) é único entre as linhas sem documento.
      - name: tipo_contato
        description: "Tipo do contato, criado na silver: `telefone` (`celular` e `fixo` do provedor) ou `email`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [telefone, email]
      - name: contato
        description: "Telefone (só dígitos, DDD + número) ou e-mail (minúsculas), conforme `tipo_contato`."
        data_tests:
          - not_null
      - name: tipo
        description: >-
          Campo `tipo` do telefone informado pelo provedor, `celular` ou `fixo`, na aparição mais recente
          do contato. `NULL` no e-mail.
        data_tests:
          - accepted_values:
              arguments:
                values: [celular, fixo]
      - name: data_primeira_entrega
        description: "Menor data de entrega dos arquivos em que o par apareceu."
        data_tests:
          - not_null
      - name: data_ultima_entrega
        description: "Maior data de entrega dos arquivos em que o par apareceu."
        data_tests:
          - not_null
      - name: _arquivo
        description: "Da aparição mais recente do par (documento, tipo_contato, contato). {{ doc('bronze_arquivo') }}"
        data_tests:
          - not_null
      - name: _linha
        description: "Da aparição mais recente do par (documento, tipo_contato, contato). {{ doc('bronze_linha') }}"
        data_tests:
          - not_null
      - name: _hash_arquivo
        description: "Da aparição mais recente do par (documento, tipo_contato, contato). {{ doc('bronze_hash_arquivo') }}"
        data_tests:
          - not_null
