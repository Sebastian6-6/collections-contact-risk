version: 2

models:
  - name: silver_alfa_devedores_padronizados
    description: >
      Etapa efêmera (não vira tabela) da silver do alfa. Uma linha por linha lida da bronze que
      tem documento, com toda a padronização já aplicada e sem deduplicar. Alimenta `devedores_historico`, de onde saem
      `devedores` (versão mais recente) e `devedores_contatos` (todas as versões).
    config:
      materialized: ephemeral

  - name: silver_alfa_devedores
    description: >
      Devedores do provedor alfa, uma linha por documento normalizado, tirada de `devedores_historico`. Vale a versão mais recente
      do documento: maior data de atualização da fonte, depois maior data de entrega, depois maior
      arquivo (nome) e maior linha. Documento vazio, sem dígitos ou só com zeros (`0`,
      `000.000.000-00`) não identifica ninguém: a linha não vira devedor (fica fora antes de
      escolher a versão) e continua na bronze, e os contatos dela estão em `devedores_contatos`
      com `documento` NULL. Nenhuma
      coluna recebe marcação interpretativa: datas sentinela (1900-01-01) e CPFs inválidos passam
      como vieram.
    columns:
      - name: documento
        description: >-
          Documento do devedor só com dígitos, com os zeros à esquerda repostos até 11 posições,
          vindo de `cpf` ou de `documento` da bronze (o provedor renomeou a coluna). Nunca é NULL
          nem só zeros: documento vazio ou zerado não identifica ninguém. Chave da tabela.
        data_tests:
          - unique
          - not_null
      - name: nome_completo
        description: "Nome do devedor, sem espaços nas pontas; `NULL` quando vazio. Texto livre em maiúscula (H4)."
      - name: data_nascimento
        description: "Data de nascimento. A data sentinela 1900-01-01 da origem fica como veio."
      - name: cnpj_empregador
        description: >-
          CNPJ do empregador, padronizado para 14 caracteres alfanuméricos.
          Regra (macro `cnpj_normalizado`): só letras e dígitos, em maiúsculas. Com 14
          caracteres, fica como veio. Com menos, completa com zeros à esquerda se o resultado tiver
          dígitos verificadores válidos; com 12 caracteres e sem essa possibilidade, calcula os dois
          dígitos pela regra oficial da Receita. O que não encaixa fica como veio (limitação da
          base, teste `cnpj_do_empregador_fora_da_regra`). Todo valor de 14 caracteres tem dígitos
          verificadores válidos (teste `cnpj_do_empregador_com_digito_verificador_valido`).
          `NULL` quando o provedor não informou.
      - name: cargo
        description: "Cargo do devedor; `NULL` quando vazio. Texto livre em maiúscula (H4)."
      - name: salario_informado
        description: >-
          Salário informado em `NUMERIC(14, 2)`. `NULL` quando vazio; o zero informado pelo
          provedor fica 0.00.
      - name: telefone
        description: "Telefone da versão mais recente, só dígitos, DDD + número, sem o código do país."
      - name: email
        description: "E-mail da versão mais recente, em minúsculas; `NULL` quando vazio."
      - name: endereco
        description: "Endereço em texto, aparado nas pontas. Texto livre em maiúscula (H4)."
      - name: logradouro
        description: >-
          Logradouro, só quando `endereco` casa inteiro com `logradouro, numero[, complemento] -
          bairro - cidade`; senão `NULL`, como todas as outras partes.
          Texto livre em maiúscula (H4).
      - name: numero
        description: "Número do endereço (pode ser `S/N`); `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: complemento
        description: "Complemento do endereço; `NULL` quando não há ou o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: bairro
        description: "Bairro; `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: cidade
        description: "Cidade; `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: cep
        description: "CEP só com dígitos, com o zero à esquerda reposto até 8 posições."
      - name: uf
        description: >-
          Sigla da UF em maiúsculas e sem espaços nas pontas. Valor fora das 27 UFs (a origem manda
          `XX`) vira `NULL`; `NULL` também quando vazio.
        data_tests:
          - accepted_values:
              arguments:
                values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      - name: data_atualizacao
        description: "Data de atualização do registro informada pelo provedor, usada para escolher a versão."
      - name: data_entrega
        description: >-
          Data da entrega do arquivo de onde veio a versão: a data escrita no nome do arquivo ou,
          só no arquivo histórico configurado, a variável `data_carga_historica` (2026-08-31, enunciado p. 1). `NULL` em entrega diária sem data válida no nome, o que reprova o teste `entrega_diaria_sem_data_valida`.
      - name: hash_conteudo
        description: >-
          Chave da versão atual na histórica (`silver_alfa.devedores_historico`): liga o devedor ao conteúdo de que ele saiu.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_alfa_devedores_historico')
                field: hash_conteudo
      - name: _arquivo
        description: "{{ doc('bronze_arquivo') }}"
        data_tests:
          - not_null
      - name: _linha
        description: "{{ doc('bronze_linha') }}"
        data_tests:
          - not_null
      - name: _hash_arquivo
        description: "{{ doc('bronze_hash_arquivo') }}"
        data_tests:
          - not_null

  - name: silver_alfa_devedores_historico
    description: >
      Todas as versões dos registros do provedor alfa, uma linha por versão. Versão é o mesmo
      conteúdo padronizado (documento incluído, listas incluídas), sem contar `_arquivo`, `_linha`,
      `_hash_arquivo` e `data_entrega`; a data de atualização da fonte é conteúdo, e NULL é igual a
      NULL. O conteúdo igual colapsa onde quer que apareça, e a ordem dos elementos de uma lista não
      cria versão. Entram as linhas sem documento (`documento` NULL). Fica de fora a linha que repete
      o cabeçalho do próprio arquivo, que continua na bronze (teste `cabecalho_repetido_fora_da_historica`,
      `warn`). As colunas de negócio são as de `devedores`; as listas viram tabelas filhas por versão
      ou colunas.
    columns:
      - name: documento
        description: >-
          Documento do devedor, como em `silver_alfa.devedores`. `NULL` nas versões de linhas de documento vazio ou zerado, que não identificam ninguém e estão aqui para a gold e para os contatos delas.
      - name: nome_completo
        description: "Nome do devedor, sem espaços nas pontas; `NULL` quando vazio. Texto livre em maiúscula (H4)."
      - name: data_nascimento
        description: "Data de nascimento. A data sentinela 1900-01-01 da origem fica como veio."
      - name: cnpj_empregador
        description: >-
          CNPJ do empregador, padronizado para 14 caracteres alfanuméricos.
          Regra (macro `cnpj_normalizado`): só letras e dígitos, em maiúsculas. Com 14
          caracteres, fica como veio. Com menos, completa com zeros à esquerda se o resultado tiver
          dígitos verificadores válidos; com 12 caracteres e sem essa possibilidade, calcula os dois
          dígitos pela regra oficial da Receita. O que não encaixa fica como veio (limitação da
          base, teste `cnpj_do_empregador_fora_da_regra`). Todo valor de 14 caracteres tem dígitos
          verificadores válidos (teste `cnpj_do_empregador_com_digito_verificador_valido`).
          `NULL` quando o provedor não informou.
      - name: cargo
        description: "Cargo do devedor; `NULL` quando vazio. Texto livre em maiúscula (H4)."
      - name: salario_informado
        description: >-
          Salário informado em `NUMERIC(14, 2)`. `NULL` quando vazio; o zero informado pelo
          provedor fica 0.00.
      - name: telefone
        description: "Telefone da versão mais recente, só dígitos, DDD + número, sem o código do país."
      - name: email
        description: "E-mail da versão mais recente, em minúsculas; `NULL` quando vazio."
      - name: endereco
        description: "Endereço em texto, aparado nas pontas. Texto livre em maiúscula (H4)."
      - name: logradouro
        description: >-
          Logradouro, só quando `endereco` casa inteiro com `logradouro, numero[, complemento] -
          bairro - cidade`; senão `NULL`, como todas as outras partes.
          Texto livre em maiúscula (H4).
      - name: numero
        description: "Número do endereço (pode ser `S/N`); `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: complemento
        description: "Complemento do endereço; `NULL` quando não há ou o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: bairro
        description: "Bairro; `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: cidade
        description: "Cidade; `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: cep
        description: "CEP só com dígitos, com o zero à esquerda reposto até 8 posições."
      - name: uf
        description: >-
          Sigla da UF em maiúsculas e sem espaços nas pontas. Valor fora das 27 UFs (a origem manda
          `XX`) vira `NULL`; `NULL` também quando vazio.
        data_tests:
          - accepted_values:
              arguments:
                values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      - name: data_atualizacao
        description: "Data de atualização do registro informada pelo provedor, usada para escolher a versão."
      - name: hash_conteudo
        description: >-
          Chave da versão: `MD5` do conteúdo padronizado da linha (colunas acima, com o documento) mais a assinatura ordenada de cada lista. Duas linhas com o mesmo conteúdo têm o mesmo hash, onde quer que apareçam; `data_entrega` e a rastreabilidade não entram. Chave da tabela. O texto que o `CAST` gera para o hash pode diferir entre DuckDB e PostgreSQL, então a chave não é portável entre os motores (não verificado).
        data_tests:
          - unique
          - not_null
      - name: data_primeira_entrega
        description: >-
          Menor data de entrega dos arquivos em que a versão apareceu.
        data_tests:
          - not_null
      - name: data_ultima_entrega
        description: >-
          Maior data de entrega dos arquivos em que a versão apareceu.
        data_tests:
          - not_null
      - name: _arquivo
        description: "Da aparição mais recente da versão. {{ doc('bronze_arquivo') }}"
        data_tests:
          - not_null
      - name: _linha
        description: "Da aparição mais recente da versão. {{ doc('bronze_linha') }}"
        data_tests:
          - not_null
      - name: _hash_arquivo
        description: "Da aparição mais recente da versão. {{ doc('bronze_hash_arquivo') }}"
        data_tests:
          - not_null

  - name: silver_alfa_devedores_contatos
    description: >
      Histórico de contatos do provedor alfa, uma linha por (documento, tipo_contato,
      contato normalizado), tirado de `devedores_historico`. Considera todas as linhas da bronze com documento, não só a versão atual do
      devedor: um telefone ou e-mail que saiu da versão mais recente continua registrado, com a
      última data de entrega em que apareceu. Só existe linha para contato que veio preenchido.
    data_tests:
      - combinacao_unica:
          arguments:
            colunas: [documento, tipo_contato, contato]
    columns:
      - name: documento
        description: >-
          Documento do devedor, como em `silver_alfa.devedores`. `NULL` nos contatos de linhas de
          documento vazio ou zerado, que não são devedor: nesse caso o par (`tipo_contato`,
          `contato`) é único entre as linhas sem documento.
      - name: tipo_contato
        description: "Tipo do contato, criado na silver: `telefone` ou `email`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [telefone, email]
      - name: contato
        description: "Telefone (só dígitos, DDD + número) ou e-mail (minúsculas), conforme `tipo_contato`."
        data_tests:
          - not_null
      - name: data_primeira_entrega
        description: "Menor data de entrega dos arquivos em que o par apareceu."
        data_tests:
          - not_null
      - name: data_ultima_entrega
        description: "Maior data de entrega dos arquivos em que o par apareceu."
        data_tests:
          - not_null
      - name: _arquivo
        description: "Da aparição mais recente do par (documento, tipo_contato, contato). {{ doc('bronze_arquivo') }}"
        data_tests:
          - not_null
      - name: _linha
        description: "Da aparição mais recente do par (documento, tipo_contato, contato). {{ doc('bronze_linha') }}"
        data_tests:
          - not_null
      - name: _hash_arquivo
        description: "Da aparição mais recente do par (documento, tipo_contato, contato). {{ doc('bronze_hash_arquivo') }}"
        data_tests:
          - not_null

  - name: silver_alfa_devedores_enderecos
    description: >
      Endereços do provedor alfa, uma linha por (documento, endereço padronizado), tirada de
      `devedores_historico`. Considera todas as versões da histórica, não só a atual: um endereço que saiu da versão mais recente continua registrado. O endereço é o conjunto das partes
      padronizadas, e o texto original não entra na identidade (só se todas as partes forem
      `NULL`). Só existe linha para endereço que veio preenchido. A versão sem documento entra com
      `documento` `NULL`, deduplicada só pelo endereço e nunca junta a um documento válido. Com a
      primeira e a última data de entrega em que o par apareceu.
    data_tests:
      - combinacao_unica:
          arguments:
            colunas: [documento, hash_endereco]
    columns:
      - name: documento
        description: >-
          Documento do devedor, como em `silver_alfa.devedores`. `NULL` nos endereços de linhas de
          documento vazio ou zerado, que não são devedor: nesse caso o endereço é único entre as
          linhas sem documento.
      - name: hash_endereco
        description: >-
          Identidade do endereço, criada na silver: `MD5` das partes padronizadas (`logradouro`,
          `numero`, `complemento`, `bairro`, `cidade`, `uf`, `cep`) pela macro `hash_conteudo`, sem
          o documento, para a gold achar o mesmo endereço em documentos diferentes. O texto original
          só entra quando todas as partes são `NULL`. Igual nas três fontes para as mesmas partes
          (o hash não é portável entre DuckDB e PostgreSQL, não verificado).
        data_tests:
          - not_null
      - name: endereco
        description: "Endereço em texto da aparição mais recente do par, aparado nas pontas. Não entra na identidade do endereço. Texto livre em maiúscula (H4)."
      - name: logradouro
        description: "Logradouro, só quando o endereço em texto casa com o padrão; senão `NULL`, como as outras partes. Texto livre em maiúscula (H4)."
      - name: numero
        description: "Número do endereço (pode ser `S/N`); `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: complemento
        description: "Complemento do endereço; `NULL` quando não há ou o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: bairro
        description: "Bairro; `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: cidade
        description: "Cidade; `NULL` quando o endereço não casa com o padrão. Texto livre em maiúscula (H4)."
      - name: uf
        description: >-
          Sigla da UF em maiúsculas e sem espaços nas pontas. Valor fora das 27 UFs vira `NULL`;
          `NULL` também quando vazio.
        data_tests:
          - accepted_values:
              arguments:
                values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
      - name: cep
        description: "CEP só com dígitos, com o zero à esquerda reposto até 8 posições."
      - name: data_primeira_entrega
        description: "Menor data de entrega dos arquivos em que o par apareceu."
        data_tests:
          - not_null
      - name: data_ultima_entrega
        description: "Maior data de entrega dos arquivos em que o par apareceu."
        data_tests:
          - not_null
      - name: _arquivo
        description: "Da aparição mais recente do par (documento, endereço). {{ doc('bronze_arquivo') }}"
        data_tests:
          - not_null
      - name: _linha
        description: "Da aparição mais recente do par (documento, endereço). {{ doc('bronze_linha') }}"
        data_tests:
          - not_null
      - name: _hash_arquivo
        description: "Da aparição mais recente do par (documento, endereço). {{ doc('bronze_hash_arquivo') }}"
        data_tests:
          - not_null
