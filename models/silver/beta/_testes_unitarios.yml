version: 2

unit_tests:
  - name: silver_beta_padronizacao_das_variantes_de_json
    description: >
      As variantes do JSON do beta viram colunas de nome fixo: `cpf` ou `documento` com tipo
      (o RG fica com o tipo e sem virar CPF), os três nomes do devedor, renda em número, texto ou
      nula, data de atualização ISO ou epoch em milissegundos, e-mail em lista ou texto. A data de
      entrega sai do nome do arquivo e, no histórico, da variável do projeto. JSON truncado fica
      fora.
    model: silver_beta_devedores_padronizados
    given:
      - input: source('bronze_beta', 'devedores')
        rows:
          - {registro: '{"cpf": "103.123.916-20", "nome": " Ana Souza ", "data_nascimento": "1990-02-03", "contato": {"telefones": ["11900405285"], "emails": ["ANA@X.COM"]}, "enderecos": [], "vinculo_empresa": {"cnpj": "191", "desde": "2020-05"}, "renda_mensal": 4090.2, "atualizado_em": 1784911247000}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 1, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"documento": {"tipo": "RG", "valor": "16.142.929-8"}, "nome_devedor": "Bia Lima", "data_nascimento": "03/02/1990", "contato": {"telefones": [], "email": " BIA@X.COM "}, "endereco": {"cidade": "Santos"}, "vinculo_empresa": null, "renda_mensal": "R$ 1.400,00", "atualizado_em": "2026-09-02T10:30:00-03:00"}', _arquivo: "contact_data/entregas_diarias/beta/provedor_beta_2026-09-05.jsonl", _linha: 7, _hash_arquivo: "h2", _motivo_ilegivel: null}
          - {registro: '{"documento": {"tipo": "CPF", "valor": "1006543201"}, "nome_completo": "Caio Reis", "contato": {"telefones": [], "emails": []}, "renda_mensal": null, "atualizado_em": "2026-09-03T08:00:00-03:00"}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 2, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"cpf": "94502272841", "nome": "Registro Interrompido", "contato": {"telefones": [{"ddd": "1', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 4, _hash_arquivo: "h1", _motivo_ilegivel: null}
    expect:
      rows:
        - {documento_tipo: "CPF", documento: "10312391620", nome_completo: "Ana Souza", data_nascimento: "1990-02-03", vinculo_empresa_cnpj: "00000000000191", vinculo_empresa_desde: "2020-05-01", renda_mensal: 4090.20, atualizado_em: "2026-07-24", data_entrega: "2026-08-31", email_unico: null, _linha: 1}
        - {documento_tipo: "RG", documento: "161429298", nome_completo: "Bia Lima", data_nascimento: "1990-02-03", vinculo_empresa_cnpj: null, vinculo_empresa_desde: null, renda_mensal: 1400.00, atualizado_em: "2026-09-02", data_entrega: "2026-09-05", email_unico: "bia@x.com", _linha: 7}
        - {documento_tipo: "CPF", documento: "01006543201", nome_completo: "Caio Reis", data_nascimento: null, vinculo_empresa_cnpj: null, vinculo_empresa_desde: null, renda_mensal: null, atualizado_em: "2026-09-03", data_entrega: "2026-08-31", email_unico: null, _linha: 2}

  - name: silver_beta_documento_vazio_ou_zerado_vira_nulo
    description: >
      Documento nulo, vazio ou só com zeros (CPF ou RG) não identifica ninguém: `documento` vira
      `NULL`, junto com `documento_tipo`, e a linha continua na etapa padronizada, com os contatos
      dela, para `devedores_contatos` guardá-los sem documento. JSON truncado fica fora.
    model: silver_beta_devedores_padronizados
    given:
      - input: source('bronze_beta', 'devedores')
        rows:
          - {registro: '{"cpf": null, "nome": "Sem Chave", "contato": {"telefones": [], "emails": []}}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 3, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"cpf": "000.000.000-00", "nome": "Zerado", "contato": {"telefones": [], "emails": []}}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 5, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"documento": {"tipo": "RG", "valor": "0"}, "nome": "RG Zerado", "contato": {"telefones": [], "emails": []}}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 6, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"cpf": "94502272841", "nome": "Registro Interrompido", "contato": {"telefones": [{"ddd": "1', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 4, _hash_arquivo: "h1", _motivo_ilegivel: null}
    expect:
      rows:
        - {documento_tipo: null, documento: null, nome_completo: "Sem Chave", _linha: 3}
        - {documento_tipo: null, documento: null, nome_completo: "Zerado", _linha: 5}
        - {documento_tipo: null, documento: null, nome_completo: "RG Zerado", _linha: 6}

  - name: silver_beta_devedores_versao_mais_recente
    description: >
      Uma linha por (tipo de documento, documento): CPF e RG de mesmo número são pessoas
      diferentes. Vale a maior data de atualização; no empate, a maior data de entrega; no empate
      dos dois, a maior linha. Uma entrega tardia que reenvia um registro mais antigo não vence.
      Linha sem documento (NULL) não é devedor e não forma grupo.
    model: silver_beta_devedores
    given:
      - input: ref('silver_beta_devedores_padronizados')
        format: sql
        rows: |
          SELECT 'CPF' AS documento_tipo, '123' AS documento, 'NOME 1' AS nome_completo, CAST(NULL AS DATE) AS data_nascimento, CAST(NULL AS VARCHAR) AS vinculo_empresa_cnpj, CAST(NULL AS DATE) AS vinculo_empresa_desde, CAST(NULL AS DECIMAL(14, 2)) AS renda_mensal, CAST('2026-07-01' AS DATE) AS atualizado_em, CAST('2026-08-31' AS DATE) AS data_entrega, 'f1' AS _arquivo, 5 AS _linha, 'h' AS _hash_arquivo
          UNION ALL
          SELECT 'CPF', '123', 'NOME 2', NULL, NULL, NULL, NULL, CAST('2026-09-17' AS DATE), CAST('2026-09-18' AS DATE), 'f2', 1, 'h'
          UNION ALL
          SELECT 'CPF', '123', 'REENVIO ATRASADO', NULL, NULL, NULL, NULL, CAST('2026-09-10' AS DATE), CAST('2026-09-19' AS DATE), 'f3', 9, 'h'
          UNION ALL
          SELECT 'RG', '123', 'OUTRA PESSOA', NULL, NULL, NULL, NULL, CAST('2026-01-01' AS DATE), CAST('2026-08-31' AS DATE), 'f1', 6, 'h'
          UNION ALL
          SELECT 'CPF', '456', 'EMPATE 1', NULL, NULL, NULL, NULL, CAST('2026-07-01' AS DATE), CAST('2026-09-03' AS DATE), 'f2', 4, 'h'
          UNION ALL
          SELECT 'CPF', '456', 'EMPATE 2', NULL, NULL, NULL, NULL, CAST('2026-07-01' AS DATE), CAST('2026-09-03' AS DATE), 'f2', 8, 'h'
          UNION ALL
          SELECT CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR), 'SEM DOCUMENTO 1', NULL, NULL, NULL, NULL, CAST('2026-09-20' AS DATE), CAST('2026-09-20' AS DATE), 'f5', 1, 'h'
          UNION ALL
          SELECT CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR), 'SEM DOCUMENTO 2', NULL, NULL, NULL, NULL, CAST('2026-09-21' AS DATE), CAST('2026-09-21' AS DATE), 'f5', 2, 'h'
    expect:
      rows:
        - {documento_tipo: "CPF", documento: "123", nome_completo: "NOME 2", _linha: 1}
        - {documento_tipo: "RG", documento: "123", nome_completo: "OUTRA PESSOA", _linha: 6}
        - {documento_tipo: "CPF", documento: "456", nome_completo: "EMPATE 2", _linha: 8}

  - name: silver_beta_devedores_contatos_historico_e_atributos
    description: >
      Telefone como texto e como objeto (DDD + número) vira o mesmo contato normalizado, e a
      primeira e a última data de entrega cobrem as duas aparições. O tipo e o `principal` vêm da
      aparição mais recente (atualização mais nova), mesmo quando a mais antiga os trazia de outro
      jeito, e a rastreabilidade (`_arquivo`, `_linha`, `_hash_arquivo`) é dessa aparição. Um telefone que saiu da versão atual continua registrado. E-mail vem da lista ou do
      texto único e sem tipo de telefone. Contato de linha sem documento (NULL) entra com tipo de
      documento e documento NULL, deduplicado só por (tipo_contato, contato) entre as linhas sem
      documento, e nunca se junta ao par de um documento válido com o mesmo telefone.
    model: silver_beta_devedores_contatos
    given:
      - input: ref('silver_beta_devedores_padronizados')
        format: sql
        rows: |
          SELECT 'CPF' AS documento_tipo, '123' AS documento, CAST('2026-07-01' AS DATE) AS atualizado_em, CAST('2026-08-31' AS DATE) AS data_entrega, 1 AS _linha, 'b1' AS _arquivo, 'h1' AS _hash_arquivo, CAST('["+55 11 90040-5285", "2199998888"]' AS JSON) AS lista_telefones, CAST('["ANA@X.COM"]' AS JSON) AS lista_emails, CAST(NULL AS VARCHAR) AS email_unico
          UNION ALL
          SELECT 'CPF', '123', CAST('2026-09-10' AS DATE), CAST('2026-09-10' AS DATE), 2, 'b2', 'h2', CAST('[{"ddd": "11", "numero": "900405285", "tipo": "celular", "principal": true}]' AS JSON), CAST(NULL AS JSON), 'ana@x.com'
          UNION ALL
          SELECT 'RG', '123', CAST('2026-09-11' AS DATE), CAST('2026-09-11' AS DATE), 3, 'b3', 'h3', CAST('[{"ddd": "11", "numero": "900405285", "tipo": "fixo", "principal": false}]' AS JSON), CAST('[]' AS JSON), CAST(NULL AS VARCHAR)
          UNION ALL
          SELECT CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR), CAST('2026-09-01' AS DATE), CAST('2026-09-01' AS DATE), 4, 'b4', 'h4', CAST('["11900405285"]' AS JSON), CAST('[]' AS JSON), CAST(NULL AS VARCHAR)
          UNION ALL
          SELECT CAST(NULL AS VARCHAR), CAST(NULL AS VARCHAR), CAST('2026-09-12' AS DATE), CAST('2026-09-12' AS DATE), 6, 'b6', 'h6', CAST('[{"ddd": "11", "numero": "900405285", "tipo": "celular", "principal": true}]' AS JSON), CAST('[]' AS JSON), 'z@x.com'
    expect:
      rows:
        - {documento_tipo: "CPF", documento: "123", tipo_contato: "telefone", contato: "11900405285", tipo: "celular", principal: true, data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-09-10", _arquivo: "b2", _linha: 2, _hash_arquivo: "h2"}
        - {documento_tipo: "CPF", documento: "123", tipo_contato: "telefone", contato: "2199998888", tipo: null, principal: null, data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-08-31", _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
        - {documento_tipo: "CPF", documento: "123", tipo_contato: "email", contato: "ana@x.com", tipo: null, principal: null, data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-09-10", _arquivo: "b2", _linha: 2, _hash_arquivo: "h2"}
        - {documento_tipo: "RG", documento: "123", tipo_contato: "telefone", contato: "11900405285", tipo: "fixo", principal: false, data_primeira_entrega: "2026-09-11", data_ultima_entrega: "2026-09-11", _arquivo: "b3", _linha: 3, _hash_arquivo: "h3"}
        - {documento_tipo: null, documento: null, tipo_contato: "telefone", contato: "11900405285", tipo: "celular", principal: true, data_primeira_entrega: "2026-09-01", data_ultima_entrega: "2026-09-12", _arquivo: "b6", _linha: 6, _hash_arquivo: "h6"}
        - {documento_tipo: null, documento: null, tipo_contato: "email", contato: "z@x.com", tipo: null, principal: null, data_primeira_entrega: "2026-09-12", data_ultima_entrega: "2026-09-12", _arquivo: "b6", _linha: 6, _hash_arquivo: "h6"}

  - name: silver_beta_devedores_enderecos_versao_atual
    description: >
      Só a lista de endereços da versão atual do devedor entra, com a posição de cada um e o
      `atual` como veio; o objeto único vira a posição 1; o CEP de 7 dígitos ou com hífen vira 8
      dígitos. A lista de uma versão antiga fica fora.
    model: silver_beta_devedores_enderecos
    given:
      - input: ref('silver_beta_devedores')
        rows:
          - {documento_tipo: "CPF", documento: "123", _arquivo: "f2", _linha: 1, _hash_arquivo: "h"}
          - {documento_tipo: "CPF", documento: "456", _arquivo: "f2", _linha: 2, _hash_arquivo: "h"}
      - input: ref('silver_beta_devedores_padronizados')
        format: sql
        rows: |
          SELECT 'f1' AS _arquivo, 9 AS _linha, CAST('[{"logradouro": "Rua Antiga", "atual": true}]' AS JSON) AS lista_enderecos, CAST(NULL AS JSON) AS endereco_unico
          UNION ALL
          SELECT 'f2', 1, CAST('[{"tipo": "residencial", "logradouro": " Rua A ", "numero": "S/N", "complemento": null, "bairro": "Centro", "cidade": "Santos", "uf": " sp ", "cep": "11010-000", "atual": true}, {"tipo": "comercial", "logradouro": "Rua B", "numero": "10", "complemento": "sala 2", "bairro": "Gonzaga", "cidade": "Santos", "uf": "XX", "cep": "7359422", "atual": false}]' AS JSON), CAST(NULL AS JSON)
          UNION ALL
          SELECT 'f2', 2, CAST(NULL AS JSON), CAST('{"tipo": "residencial", "logradouro": "Rua C", "numero": "5", "complemento": "", "bairro": "Boqueirao", "cidade": "Santos", "uf": "SP", "cep": "11055300", "atual": true}' AS JSON)
    expect:
      rows:
        - {documento_tipo: "CPF", documento: "123", posicao: 1, tipo: "residencial", logradouro: "Rua A", numero: "S/N", complemento: null, bairro: "Centro", cidade: "Santos", uf: "SP", cep: "11010000", atual: true, _arquivo: "f2", _linha: 1}
        - {documento_tipo: "CPF", documento: "123", posicao: 2, tipo: "comercial", logradouro: "Rua B", numero: "10", complemento: "sala 2", bairro: "Gonzaga", cidade: "Santos", uf: null, cep: "07359422", atual: false, _arquivo: "f2", _linha: 1}
        - {documento_tipo: "CPF", documento: "456", posicao: 1, tipo: "residencial", logradouro: "Rua C", numero: "5", complemento: null, bairro: "Boqueirao", cidade: "Santos", uf: "SP", cep: "11055300", atual: true, _arquivo: "f2", _linha: 2}
