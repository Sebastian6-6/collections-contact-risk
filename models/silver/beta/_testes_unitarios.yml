version: 2

unit_tests:
  - name: silver_beta_padronizacao_das_variantes_de_json
    description: >
      As variantes do JSON do beta viram colunas de nome fixo: `cpf` ou `documento` com tipo
      (o RG fica com o tipo e sem virar CPF), os três nomes do devedor, renda em número, texto ou
      nula, data de atualização ISO ou epoch em milissegundos, e-mail em lista ou texto. A data de
      entrega sai do nome do arquivo e, no histórico, da variável do projeto. JSON truncado fica
      fora.
    model: silver_beta_devedores_padronizados
    given:
      - input: source('bronze_beta', 'devedores')
        rows:
          - {registro: '{"cpf": "103.123.916-20", "nome": " Ana Souza ", "data_nascimento": "1990-02-03", "contato": {"telefones": ["11900405285"], "emails": ["ANA@X.COM"]}, "enderecos": [], "vinculo_empresa": {"cnpj": "191", "desde": "2020-05"}, "renda_mensal": 4090.2, "atualizado_em": 1784911247000}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 1, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"documento": {"tipo": "RG", "valor": "16.142.929-8"}, "nome_devedor": "Bia Lima", "data_nascimento": "03/02/1990", "contato": {"telefones": [], "email": " BIA@X.COM "}, "endereco": {"cidade": "Santos"}, "vinculo_empresa": null, "renda_mensal": "R$ 1.400,00", "atualizado_em": "2026-09-02T10:30:00-03:00"}', _arquivo: "contact_data/entregas_diarias/beta/provedor_beta_2026-09-05.jsonl", _linha: 7, _hash_arquivo: "h2", _motivo_ilegivel: null}
          - {registro: '{"documento": {"tipo": "CPF", "valor": "1006543201"}, "nome_completo": "Caio Reis", "contato": {"telefones": [], "emails": []}, "renda_mensal": null, "atualizado_em": "2026-09-03T08:00:00-03:00"}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 2, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"cpf": "94502272841", "nome": "Registro Interrompido", "contato": {"telefones": [{"ddd": "1', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 4, _hash_arquivo: "h1", _motivo_ilegivel: null}
    expect:
      rows:
        - {documento_tipo: "CPF", documento: "10312391620", nome_completo: "ANA SOUZA", data_nascimento: "1990-02-03", vinculo_empresa_cnpj: "00000000000191", vinculo_empresa_desde: "2020-05-01", renda_mensal: 4090.20, atualizado_em: "2026-07-24", data_entrega: "2026-08-31", email_unico: null, _linha: 1}
        - {documento_tipo: "RG", documento: "161429298", nome_completo: "BIA LIMA", data_nascimento: "1990-02-03", vinculo_empresa_cnpj: null, vinculo_empresa_desde: null, renda_mensal: 1400.00, atualizado_em: "2026-09-02", data_entrega: "2026-09-05", email_unico: "bia@x.com", _linha: 7}
        - {documento_tipo: "CPF", documento: "01006543201", nome_completo: "CAIO REIS", data_nascimento: null, vinculo_empresa_cnpj: null, vinculo_empresa_desde: null, renda_mensal: null, atualizado_em: "2026-09-03", data_entrega: "2026-08-31", email_unico: null, _linha: 2}

  - name: silver_beta_documento_vazio_ou_zerado_vira_nulo
    description: >
      Documento nulo, vazio ou só com zeros (CPF ou RG) não identifica ninguém: `documento` vira
      `NULL`, junto com `documento_tipo`, e a linha continua na etapa padronizada, com os contatos
      dela, para `devedores_contatos` guardá-los sem documento. JSON truncado fica fora.
    model: silver_beta_devedores_padronizados
    given:
      - input: source('bronze_beta', 'devedores')
        rows:
          - {registro: '{"cpf": null, "nome": "Sem Chave", "contato": {"telefones": [], "emails": []}}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 3, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"cpf": "000.000.000-00", "nome": "Zerado", "contato": {"telefones": [], "emails": []}}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 5, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"documento": {"tipo": "RG", "valor": "0"}, "nome": "RG Zerado", "contato": {"telefones": [], "emails": []}}', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 6, _hash_arquivo: "h1", _motivo_ilegivel: null}
          - {registro: '{"cpf": "94502272841", "nome": "Registro Interrompido", "contato": {"telefones": [{"ddd": "1', _arquivo: "contact_data/provedor_beta.jsonl", _linha: 4, _hash_arquivo: "h1", _motivo_ilegivel: null}
    expect:
      rows:
        - {documento_tipo: null, documento: null, nome_completo: "SEM CHAVE", _linha: 3}
        - {documento_tipo: null, documento: null, nome_completo: "ZERADO", _linha: 5}
        - {documento_tipo: null, documento: null, nome_completo: "RG ZERADO", _linha: 6}

  - name: silver_beta_devedores_versao_mais_recente
    description: >
      Uma linha por (tipo de documento, documento), tirada da histórica: CPF e RG de mesmo número
      são pessoas diferentes. Vale a maior data de atualização; no empate, a maior data de entrega
      (a última da versão); no empate dos dois, a maior linha. Uma entrega tardia que reenvia um
      registro mais antigo não vence. Linha sem documento (NULL) não é devedor e não forma grupo.
    model: silver_beta_devedores
    given:
      - input: ref('silver_beta_devedores_historico')
        rows:
          - {documento_tipo: "CPF", documento: "123", nome_completo: "NOME 1", atualizado_em: "2026-07-01", data_ultima_entrega: "2026-08-31", hash_conteudo: "v1", _arquivo: "f1", _linha: 5}
          - {documento_tipo: "CPF", documento: "123", nome_completo: "NOME 2", atualizado_em: "2026-09-17", data_ultima_entrega: "2026-09-18", hash_conteudo: "v2", _arquivo: "f2", _linha: 1}
          - {documento_tipo: "CPF", documento: "123", nome_completo: "REENVIO ATRASADO", atualizado_em: "2026-09-10", data_ultima_entrega: "2026-09-19", hash_conteudo: "v3", _arquivo: "f3", _linha: 9}
          - {documento_tipo: "RG", documento: "123", nome_completo: "OUTRA PESSOA", atualizado_em: "2026-01-01", data_ultima_entrega: "2026-08-31", hash_conteudo: "v4", _arquivo: "f1", _linha: 6}
          - {documento_tipo: "CPF", documento: "456", nome_completo: "EMPATE 1", atualizado_em: "2026-07-01", data_ultima_entrega: "2026-09-03", hash_conteudo: "v5", _arquivo: "f2", _linha: 4}
          - {documento_tipo: "CPF", documento: "456", nome_completo: "EMPATE 2", atualizado_em: "2026-07-01", data_ultima_entrega: "2026-09-03", hash_conteudo: "v6", _arquivo: "f2", _linha: 8}
          - {documento_tipo: null, documento: null, nome_completo: "SEM DOCUMENTO 1", atualizado_em: "2026-09-20", data_ultima_entrega: "2026-09-20", hash_conteudo: "v7", _arquivo: "f5", _linha: 1}
          - {documento_tipo: null, documento: null, nome_completo: "SEM DOCUMENTO 2", atualizado_em: "2026-09-21", data_ultima_entrega: "2026-09-21", hash_conteudo: "v8", _arquivo: "f5", _linha: 2}
    expect:
      rows:
        - {documento_tipo: "CPF", documento: "123", nome_completo: "NOME 2", data_entrega: "2026-09-18", hash_conteudo: "v2", _linha: 1}
        - {documento_tipo: "RG", documento: "123", nome_completo: "OUTRA PESSOA", data_entrega: "2026-08-31", hash_conteudo: "v4", _linha: 6}
        - {documento_tipo: "CPF", documento: "456", nome_completo: "EMPATE 2", data_entrega: "2026-09-03", hash_conteudo: "v6", _linha: 8}

  - name: silver_beta_devedores_contatos_historico_e_atributos
    description: >
      Os pares saem da histórica e da filha de contatos. O telefone em duas versões soma a primeira e
      a última data de entrega, e o tipo e o `principal` vêm da versão com a maior ordem
      (atualização, entrega, arquivo, linha), mesmo quando a mais antiga os trazia de outro jeito;
      a rastreabilidade (`_arquivo`, `_linha`, `_hash_arquivo`) é dessa aparição. Um telefone que
      saiu da versão atual continua registrado. Contato de versão sem documento (NULL) entra com tipo
      de documento e documento NULL, deduplicado só por (tipo_contato, contato) entre as versões sem
      documento, e nunca se junta ao par de um documento válido com o mesmo telefone.
    model: silver_beta_devedores_contatos
    given:
      - input: ref('silver_beta_devedores_historico')
        rows:
          - {documento_tipo: "CPF", documento: "123", atualizado_em: "2026-07-01", data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-08-31", hash_conteudo: "v1"}
          - {documento_tipo: "CPF", documento: "123", atualizado_em: "2026-09-10", data_primeira_entrega: "2026-09-10", data_ultima_entrega: "2026-09-10", hash_conteudo: "v2"}
          - {documento_tipo: "RG", documento: "123", atualizado_em: "2026-09-11", data_primeira_entrega: "2026-09-11", data_ultima_entrega: "2026-09-11", hash_conteudo: "v3"}
          - {documento_tipo: null, documento: null, atualizado_em: "2026-09-01", data_primeira_entrega: "2026-09-01", data_ultima_entrega: "2026-09-01", hash_conteudo: "v4"}
          - {documento_tipo: null, documento: null, atualizado_em: "2026-09-12", data_primeira_entrega: "2026-09-12", data_ultima_entrega: "2026-09-12", hash_conteudo: "v5"}
      - input: ref('silver_beta_devedores_historico_contatos')
        rows:
          - {hash_conteudo: "v1", tipo_contato: "telefone", contato: "11900405285", tipo: null, principal: null, posicao: 1, _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
          - {hash_conteudo: "v1", tipo_contato: "telefone", contato: "2199998888", tipo: null, principal: null, posicao: 2, _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
          - {hash_conteudo: "v1", tipo_contato: "email", contato: "ana@x.com", tipo: null, principal: null, posicao: 1, _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
          - {hash_conteudo: "v2", tipo_contato: "telefone", contato: "11900405285", tipo: "celular", principal: true, posicao: 1, _arquivo: "b2", _linha: 2, _hash_arquivo: "h2"}
          - {hash_conteudo: "v2", tipo_contato: "email", contato: "ana@x.com", tipo: null, principal: null, posicao: 1, _arquivo: "b2", _linha: 2, _hash_arquivo: "h2"}
          - {hash_conteudo: "v3", tipo_contato: "telefone", contato: "11900405285", tipo: "fixo", principal: false, posicao: 1, _arquivo: "b3", _linha: 3, _hash_arquivo: "h3"}
          - {hash_conteudo: "v4", tipo_contato: "telefone", contato: "11900405285", tipo: null, principal: null, posicao: 1, _arquivo: "b4", _linha: 4, _hash_arquivo: "h4"}
          - {hash_conteudo: "v5", tipo_contato: "telefone", contato: "11900405285", tipo: "celular", principal: true, posicao: 1, _arquivo: "b6", _linha: 6, _hash_arquivo: "h6"}
          - {hash_conteudo: "v5", tipo_contato: "email", contato: "z@x.com", tipo: null, principal: null, posicao: 1, _arquivo: "b6", _linha: 6, _hash_arquivo: "h6"}
    expect:
      rows:
        - {documento_tipo: "CPF", documento: "123", tipo_contato: "telefone", contato: "11900405285", tipo: "celular", principal: true, data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-09-10", _arquivo: "b2", _linha: 2, _hash_arquivo: "h2"}
        - {documento_tipo: "CPF", documento: "123", tipo_contato: "telefone", contato: "2199998888", tipo: null, principal: null, data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-08-31", _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
        - {documento_tipo: "CPF", documento: "123", tipo_contato: "email", contato: "ana@x.com", tipo: null, principal: null, data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-09-10", _arquivo: "b2", _linha: 2, _hash_arquivo: "h2"}
        - {documento_tipo: "RG", documento: "123", tipo_contato: "telefone", contato: "11900405285", tipo: "fixo", principal: false, data_primeira_entrega: "2026-09-11", data_ultima_entrega: "2026-09-11", _arquivo: "b3", _linha: 3, _hash_arquivo: "h3"}
        - {documento_tipo: null, documento: null, tipo_contato: "telefone", contato: "11900405285", tipo: "celular", principal: true, data_primeira_entrega: "2026-09-01", data_ultima_entrega: "2026-09-12", _arquivo: "b6", _linha: 6, _hash_arquivo: "h6"}
        - {documento_tipo: null, documento: null, tipo_contato: "email", contato: "z@x.com", tipo: null, principal: null, data_primeira_entrega: "2026-09-12", data_ultima_entrega: "2026-09-12", _arquivo: "b6", _linha: 6, _hash_arquivo: "h6"}

  - name: silver_beta_devedores_enderecos_pares_de_documento_e_endereco
    description: >
      O mesmo endereço em duas versões do mesmo documento vira um par só, com a primeira e a
      última entrega e o `tipo`, o `atual` e a rastreabilidade da versão mais recente (no empate, a
      maior posição na lista); a posição não entra na identidade; endereço diferente é outro par;
      o endereço de uma versão sem documento (NULL) é deduplicado só entre os sem documento e
      nunca se junta ao par de um documento válido com o mesmo endereço. Um endereço que saiu da
      versão mais recente continua registrado.
    model: silver_beta_devedores_enderecos
    given:
      - input: ref('silver_beta_devedores_historico')
        rows:
          - {hash_conteudo: "v1", documento_tipo: "CPF", documento: "123", atualizado_em: "2026-08-30", data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-08-31"}
          - {hash_conteudo: "v2", documento_tipo: "CPF", documento: "123", atualizado_em: "2026-09-10", data_primeira_entrega: "2026-09-10", data_ultima_entrega: "2026-09-12"}
          - {hash_conteudo: "v3", documento_tipo: null, documento: null, atualizado_em: "2026-09-01", data_primeira_entrega: "2026-09-01", data_ultima_entrega: "2026-09-01"}
          - {hash_conteudo: "v4", documento_tipo: null, documento: null, atualizado_em: "2026-09-12", data_primeira_entrega: "2026-09-12", data_ultima_entrega: "2026-09-12"}
      - input: ref('silver_beta_devedores_historico_enderecos')
        rows:
          - {hash_conteudo: "v1", posicao: 1, tipo: "residencial", logradouro: "Rua A", numero: "10", complemento: null, bairro: "Centro", cidade: "Santos", uf: "SP", cep: "11010000", atual: true, _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
          - {hash_conteudo: "v1", posicao: 2, tipo: "comercial", logradouro: "Rua B", numero: "20", complemento: "sala 2", bairro: "Gonzaga", cidade: "Santos", uf: "SP", cep: "11055300", atual: false, _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
          - {hash_conteudo: "v2", posicao: 2, tipo: "residencial", logradouro: "Rua A", numero: "10", complemento: null, bairro: "Centro", cidade: "Santos", uf: "SP", cep: "11010000", atual: false, _arquivo: "b2", _linha: 5, _hash_arquivo: "h2"}
          - {hash_conteudo: "v3", posicao: 1, tipo: "residencial", logradouro: "Rua A", numero: "10", complemento: null, bairro: "Centro", cidade: "Santos", uf: "SP", cep: "11010000", atual: true, _arquivo: "b3", _linha: 2, _hash_arquivo: "h3"}
          - {hash_conteudo: "v4", posicao: 1, tipo: "residencial", logradouro: "Rua A", numero: "10", complemento: null, bairro: "Centro", cidade: "Santos", uf: "SP", cep: "11010000", atual: false, _arquivo: "b4", _linha: 7, _hash_arquivo: "h4"}
    expect:
      rows:
        - {documento_tipo: "CPF", documento: "123", tipo: "residencial", logradouro: "Rua A", numero: "10", complemento: null, bairro: "Centro", cidade: "Santos", uf: "SP", cep: "11010000", atual: false, data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-09-12", _arquivo: "b2", _linha: 5, _hash_arquivo: "h2"}
        - {documento_tipo: "CPF", documento: "123", tipo: "comercial", logradouro: "Rua B", numero: "20", complemento: "sala 2", bairro: "Gonzaga", cidade: "Santos", uf: "SP", cep: "11055300", atual: false, data_primeira_entrega: "2026-08-31", data_ultima_entrega: "2026-08-31", _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
        - {documento_tipo: null, documento: null, tipo: "residencial", logradouro: "Rua A", numero: "10", complemento: null, bairro: "Centro", cidade: "Santos", uf: "SP", cep: "11010000", atual: false, data_primeira_entrega: "2026-09-01", data_ultima_entrega: "2026-09-12", _arquivo: "b4", _linha: 7, _hash_arquivo: "h4"}

  - name: silver_beta_contatos_abertos_da_linha
    description: >
      Telefone como texto e como objeto (DDD + número) vira o mesmo contato normalizado, com o `tipo`
      e o `principal` do provedor só quando o elemento é objeto. E-mail vem da lista ou do texto
      único (posição 1) e não tem tipo de telefone. Contato vazio não gera linha.
    model: silver_beta_devedores_contatos_padronizados
    given:
      - input: ref('silver_beta_devedores_padronizados')
        format: sql
        rows: |
          SELECT CAST('["+55 11 90040-5285", "2199998888"]' AS JSON) AS lista_telefones, CAST('["ANA@X.COM"]' AS JSON) AS lista_emails, CAST(NULL AS VARCHAR) AS email_unico, 'b1' AS _arquivo, 1 AS _linha, 'h1' AS _hash_arquivo
          UNION ALL
          SELECT CAST('[{"ddd": "11", "numero": "900405285", "tipo": "celular", "principal": true}]' AS JSON), CAST(NULL AS JSON), 'ana@x.com', 'b2', 2, 'h2'
          UNION ALL
          SELECT CAST('[{"ddd": "11", "numero": "900405285", "tipo": "fixo", "principal": false}]' AS JSON), CAST('[]' AS JSON), CAST(NULL AS VARCHAR), 'b3', 3, 'h3'
          UNION ALL
          SELECT CAST('[""]' AS JSON), CAST('[]' AS JSON), CAST(NULL AS VARCHAR), 'b4', 4, 'h4'
    expect:
      rows:
        - {tipo_contato: "telefone", contato: "11900405285", tipo: null, principal: null, posicao: 1, _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
        - {tipo_contato: "telefone", contato: "2199998888", tipo: null, principal: null, posicao: 2, _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
        - {tipo_contato: "email", contato: "ana@x.com", tipo: null, principal: null, posicao: 1, _arquivo: "b1", _linha: 1, _hash_arquivo: "h1"}
        - {tipo_contato: "telefone", contato: "11900405285", tipo: "celular", principal: true, posicao: 1, _arquivo: "b2", _linha: 2, _hash_arquivo: "h2"}
        - {tipo_contato: "email", contato: "ana@x.com", tipo: null, principal: null, posicao: 1, _arquivo: "b2", _linha: 2, _hash_arquivo: "h2"}
        - {tipo_contato: "telefone", contato: "11900405285", tipo: "fixo", principal: false, posicao: 1, _arquivo: "b3", _linha: 3, _hash_arquivo: "h3"}

  - name: silver_beta_enderecos_abertos_da_linha
    description: >
      A lista de endereços ou o objeto único (posição 1) viram uma linha por endereço, com o `atual`
      como veio, o texto livre em maiúscula, a UF fora das 27 virando NULL e o CEP de 7 dígitos ou com hífen virando 8 dígitos.
    model: silver_beta_devedores_enderecos_padronizados
    given:
      - input: ref('silver_beta_devedores_padronizados')
        format: sql
        rows: |
          SELECT CAST('[{"tipo": "residencial", "logradouro": " Rua A ", "numero": "S/N", "complemento": null, "bairro": "Centro", "cidade": "Santos", "uf": " sp ", "cep": "11010-000", "atual": true}, {"tipo": "comercial", "logradouro": "Rua B", "numero": "10", "complemento": "sala 2", "bairro": "Gonzaga", "cidade": "Santos", "uf": "XX", "cep": "7359422", "atual": false}]' AS JSON) AS lista_enderecos, CAST(NULL AS JSON) AS endereco_unico, 'f2' AS _arquivo, 1 AS _linha, 'h' AS _hash_arquivo
          UNION ALL
          SELECT CAST(NULL AS JSON), CAST('{"tipo": "residencial", "logradouro": "Rua C", "numero": "5", "complemento": "", "bairro": "Boqueirao", "cidade": "Santos", "uf": "SP", "cep": "11055300", "atual": true}' AS JSON), 'f2', 2, 'h'
    expect:
      rows:
        - {posicao: 1, tipo: "residencial", logradouro: "RUA A", numero: "S/N", complemento: null, bairro: "CENTRO", cidade: "SANTOS", uf: "SP", cep: "11010000", atual: true, _arquivo: "f2", _linha: 1}
