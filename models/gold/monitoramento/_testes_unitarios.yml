version: 2

unit_tests:
  - name: ft_entrega_diaria_acha_dia_sem_entrega_e_cabecalho_que_mudou
    description: >
      D2. A entrega n é comparada com a n - 1 do mesmo provedor: 1 dia entre 01/09 e 02/09, 3 entre
      02/09 e 05/09 (dois dias sem entrega). A primeira entrega não tem anterior. O cabeçalho que
      muda entre duas entregas dá `mudou`; igual dá `igual`; a primeira fica `NULL`. Outro provedor
      não entra na comparação.
    model: ft_entrega_diaria
    given:
      - input: ref('entregas_diarias_apuradas')
        rows:
          - {provedor: alfa, dt_referencia: 2026-09-01, desc_cabecalho: "cpf,nome"}
          - {provedor: alfa, dt_referencia: 2026-09-02, desc_cabecalho: "cpf,nome"}
          - {provedor: alfa, dt_referencia: 2026-09-05, desc_cabecalho: "documento,nome"}
          - {provedor: gama, dt_referencia: 2026-09-03, desc_cabecalho: "documento,nome"}
    expect:
      rows:
        - {provedor: alfa, dt_referencia: 2026-09-01, qt_dias_desde_entrega_anterior: null, situacao_cabecalho: null}
        - {provedor: alfa, dt_referencia: 2026-09-02, qt_dias_desde_entrega_anterior: 1, situacao_cabecalho: igual}
        - {provedor: alfa, dt_referencia: 2026-09-05, qt_dias_desde_entrega_anterior: 3, situacao_cabecalho: mudou}
        - {provedor: gama, dt_referencia: 2026-09-03, qt_dias_desde_entrega_anterior: null, situacao_cabecalho: null}

  - name: ft_entrega_diaria_media_movel_por_tipo_de_dia_com_janela_de_5_e_limiar_de_50_por_cento
    description: >
      D3. A média usa as entregas anteriores do mesmo provedor e tipo de dia (útil ou fim de
      semana), no máximo 5, sem a do próprio dia: o fim de semana não entra na média dos dias
      úteis. Com menos de 3 entregas na base o volume é `sem_base`. 400 contra média 100 é `acima`
      (+300%); 20 contra 160 é `abaixo` (-87,5%); 160 contra 144 é `normal`, já com a entrega de
      07/09 fora da janela e a de 14/09 dentro. Outro provedor não entra na média.
    model: ft_entrega_diaria
    given:
      - input: ref('entregas_diarias_apuradas')
        rows:
          - {provedor: alfa, dt_referencia: 2026-09-07, qt_registros: 100}
          - {provedor: alfa, dt_referencia: 2026-09-08, qt_registros: 100}
          - {provedor: alfa, dt_referencia: 2026-09-09, qt_registros: 100}
          - {provedor: alfa, dt_referencia: 2026-09-10, qt_registros: 100}
          - {provedor: alfa, dt_referencia: 2026-09-11, qt_registros: 100}
          - {provedor: alfa, dt_referencia: 2026-09-12, qt_registros: 50}
          - {provedor: alfa, dt_referencia: 2026-09-13, qt_registros: 150}
          - {provedor: alfa, dt_referencia: 2026-09-14, qt_registros: 400}
          - {provedor: alfa, dt_referencia: 2026-09-15, qt_registros: 20}
          - {provedor: alfa, dt_referencia: 2026-09-16, qt_registros: 160}
          - {provedor: gama, dt_referencia: 2026-09-14, qt_registros: 1000}
    expect:
      rows:
        - {provedor: alfa, dt_referencia: 2026-09-07, tp_dia: util, qt_media_movel: null, qt_entregas_base: null, tx_variacao_media: null, situacao_volume: sem_base}
        - {provedor: alfa, dt_referencia: 2026-09-08, tp_dia: util, qt_media_movel: 100, qt_entregas_base: 1, tx_variacao_media: null, situacao_volume: sem_base}
        - {provedor: alfa, dt_referencia: 2026-09-09, tp_dia: util, qt_media_movel: 100, qt_entregas_base: 2, tx_variacao_media: null, situacao_volume: sem_base}
        - {provedor: alfa, dt_referencia: 2026-09-10, tp_dia: util, qt_media_movel: 100, qt_entregas_base: 3, tx_variacao_media: 0, situacao_volume: normal}
        - {provedor: alfa, dt_referencia: 2026-09-11, tp_dia: util, qt_media_movel: 100, qt_entregas_base: 4, tx_variacao_media: 0, situacao_volume: normal}
        - {provedor: alfa, dt_referencia: 2026-09-12, tp_dia: fim_de_semana, qt_media_movel: null, qt_entregas_base: null, tx_variacao_media: null, situacao_volume: sem_base}
        - {provedor: alfa, dt_referencia: 2026-09-13, tp_dia: fim_de_semana, qt_media_movel: 50, qt_entregas_base: 1, tx_variacao_media: null, situacao_volume: sem_base}
        - {provedor: alfa, dt_referencia: 2026-09-14, tp_dia: util, qt_media_movel: 100, qt_entregas_base: 5, tx_variacao_media: 3, situacao_volume: acima}
        - {provedor: alfa, dt_referencia: 2026-09-15, tp_dia: util, qt_media_movel: 160, qt_entregas_base: 5, tx_variacao_media: -0.875, situacao_volume: abaixo}
        - {provedor: alfa, dt_referencia: 2026-09-16, tp_dia: util, qt_media_movel: 144, qt_entregas_base: 5, tx_variacao_media: 0.1111, situacao_volume: normal}
        - {provedor: gama, dt_referencia: 2026-09-14, tp_dia: util, qt_media_movel: null, qt_entregas_base: null, tx_variacao_media: null, situacao_volume: sem_base}
