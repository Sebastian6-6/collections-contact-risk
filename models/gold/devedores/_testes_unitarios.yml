            , CAST(_hash_arquivo AS VARCHAR) AS _hash_arquivo
          FROM (
            VALUES
            (1, 1, 't1', 'ligacao', 'entregue', 'sem_confirmacao', '2026-10-12 10:00:00', DATE '2026-10-12', 'arq', 1, 'h')
            , (1, 1, 't2', 'ligacao', 'entregue', 'sem_confirmacao', '2026-11-20 10:00:00', DATE '2026-11-20', 'arq', 2, 'h')
            , (1, 1, 't3', 'ligacao', 'entregue', 'sem_confirmacao', '2026-10-13 10:00:00', DATE '2026-10-13', 'arq', 3, 'h')
          ) AS tLinhas (sk_devedor, sk_contato, contato_id, canal, resultado, tipo_desfecho, data_hora, dt_tentativa, _arquivo, _linha, _hash_arquivo)
