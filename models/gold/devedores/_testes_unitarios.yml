    given:
      - input: ref('cobranca_tentativas')
        format: sql
        rows: |
          SELECT
            CAST(sk_devedor AS INTEGER) AS sk_devedor
            , CAST(sk_contato AS INTEGER) AS sk_contato
            , CAST(contato_id AS VARCHAR) AS contato_id
            , CAST(canal AS VARCHAR) AS canal
            , CAST(resultado AS VARCHAR) AS resultado
            , CAST(tipo_desfecho AS VARCHAR) AS tipo_desfecho
            , CAST(data_hora AS TIMESTAMP) AS data_hora
