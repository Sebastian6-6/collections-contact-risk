version: 2

sources:
  - name: bronze_alfa
    description: >
      Provedor alfa: CSV de devedores, com a carga histórica e as entregas diárias de setembro de 2026. Fiel à origem: nenhuma linha é descartada
      nem interpretada na ingestão.
    tables:
      - name: devedores
        description: >
          Uma linha por linha recebida dos arquivos do provedor alfa (histórico e entregas diárias). Colunas de dados em texto, como vieram; a coluna `cpf` é `NULL` nas entregas em que o provedor passou a chamá-la `documento`, e vice-versa.
        data_tests:
          - colunas_declaradas
          - combinacao_unica:
              arguments:
                colunas: [_arquivo, _linha]
          - linhas_iguais_ao_registro:
              arguments:
                registro: source('bronze_alfa', 'arquivos')
        columns:
          - name: cpf
            description: >-
              CPF do devedor como veio, com ou sem pontuação. `NULL` nos arquivos em que o provedor usa `documento` no lugar.
          - name: nome_completo
            description: "Nome do devedor."
          - name: data_nascimento
            description: "Data de nascimento em texto, no formato da origem."
          - name: cnpj_empregador
            description: "CNPJ do empregador em texto, como veio."
          - name: cargo
            description: "Cargo do devedor."
          - name: salario_informado
            description: "Salário informado em texto, no formato da origem (decimal com vírgula)."
          - name: telefone
            description: "Telefone em texto, como veio."
          - name: email
            description: "E-mail do devedor."
          - name: endereco
            description: "Endereço em uma só string, como veio."
          - name: cep
            description: "CEP em texto, como veio."
          - name: uf
            description: "Sigla da UF."
          - name: data_atualizacao
            description: "Data de atualização do registro informada pelo provedor, em texto."
          - name: documento
            description: >-
              Documento do devedor nos arquivos em que a coluna `cpf` passou a se chamar `documento`. `NULL` nos demais arquivos.
          - name: _arquivo
            description: "{{ doc('bronze_arquivo') }}"
            data_tests:
              - not_null
          - name: _linha
            description: "{{ doc('bronze_linha') }}"
            data_tests:
              - not_null
          - name: _hash_arquivo
            description: "{{ doc('bronze_hash_arquivo') }}"
            data_tests:
              - not_null
          - name: _linha_original
            description: "{{ doc('bronze_linha_original') }}"
            data_tests:
              - not_null
          - name: _motivo_ilegivel
            description: "{{ doc('bronze_motivo_ilegivel') }}"

      - name: arquivos
        description: "{{ doc('bronze_arquivos_tabela') }}"
        data_tests:
        - colunas_declaradas
        columns:
          - name: arquivo
            description: "{{ doc('bronze_arquivos_arquivo') }}"
            data_tests:
              - not_null
              - unique
          - name: entidade
            description: "{{ doc('bronze_arquivos_entidade') }}"
            data_tests:
              - not_null
          - name: hash_arquivo
            description: "{{ doc('bronze_arquivos_hash') }}"
            data_tests:
              - not_null
          - name: bytes
            description: "{{ doc('bronze_arquivos_bytes') }}"
            data_tests:
              - not_null
          - name: linhas
            description: "{{ doc('bronze_arquivos_linhas') }}"
            data_tests:
              - not_null
          - name: cabecalho
            description: "{{ doc('bronze_arquivos_cabecalho') }}"
