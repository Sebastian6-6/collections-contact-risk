version: 2

sources:
  - name: bronze_beta
    description: >
      Provedor beta: JSONL de devedores, com a carga histórica e as entregas diárias de setembro de 2026. Fiel à origem: nenhuma linha é descartada
      nem interpretada na ingestão.
    tables:
      - name: devedores
        description: >
          Uma linha por linha recebida dos arquivos do provedor beta. O JSON não é interpretado na bronze: o texto da linha fica em `registro`, e a validação e a abertura dos campos ficam na silver.
        data_tests:
          - colunas_declaradas
          - combinacao_unica:
              arguments:
                colunas: [_arquivo, _linha]
          - linhas_iguais_ao_registro:
              arguments:
                registro: source('bronze_beta', 'arquivos')
        columns:
          - name: registro
            description: "Texto da linha do JSONL, como veio, válido ou não."
          - name: _arquivo
            description: "{{ doc('bronze_arquivo') }}"
            data_tests:
              - not_null
          - name: _linha
            description: "{{ doc('bronze_linha') }}"
            data_tests:
              - not_null
          - name: _hash_arquivo
            description: "{{ doc('bronze_hash_arquivo') }}"
            data_tests:
              - not_null
          - name: _linha_original
            description: "{{ doc('bronze_linha_original') }}"
            data_tests:
              - not_null
          - name: _motivo_ilegivel
            description: "{{ doc('bronze_motivo_ilegivel') }}"

      - name: arquivos
        description: "{{ doc('bronze_arquivos_tabela') }}"
        data_tests:
        - colunas_declaradas
        columns:
          - name: arquivo
            description: "{{ doc('bronze_arquivos_arquivo') }}"
            data_tests:
              - not_null
              - unique
          - name: entidade
            description: "{{ doc('bronze_arquivos_entidade') }}"
            data_tests:
              - not_null
          - name: hash_arquivo
            description: "{{ doc('bronze_arquivos_hash') }}"
            data_tests:
              - not_null
          - name: bytes
            description: "{{ doc('bronze_arquivos_bytes') }}"
            data_tests:
              - not_null
          - name: linhas
            description: "{{ doc('bronze_arquivos_linhas') }}"
            data_tests:
              - not_null
          - name: cabecalho
            description: "{{ doc('bronze_arquivos_cabecalho') }}"
